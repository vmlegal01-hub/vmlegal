<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · VM Legal</title>
<link rel="icon" href="../assets/img/favicon.png">
<style>
  :root { --teal: #04748f; --ink: #0c1821; --line: #e4e9ee; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         font: 16px/1.5 "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--ink) linear-gradient(115deg, transparent 58%, rgba(0,147,189,.45) 58%, rgba(4,116,143,.85)); color: #232323; }
  .card { width: min(400px, 100%); background: #fff; border-radius: 18px; padding: 36px 32px; box-shadow: 0 30px 60px rgba(0,0,0,.35); }
  .card img { display: block; height: 64px; margin: 0 auto 8px; }
  h1 { font: 300 1.15rem/1.3 "Oswald", sans-serif; letter-spacing: .14em; text-transform: uppercase; text-align: center; margin: 0 0 24px; color: var(--ink); }
  label { display: block; font-size: .8rem; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; min-height: 46px; padding: 0 14px; font: inherit; border: 1px solid var(--line); border-radius: 10px; }
  input:focus { outline: none; border-color: #0093bd; box-shadow: 0 0 0 3px rgba(0,147,189,.16); }
  button { width: 100%; min-height: 48px; margin-top: 22px; border: 0; border-radius: 999px; background: var(--teal); color: #fff;
           font: 500 .8rem "Oswald", sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.4em; margin: 14px 0 0; font-size: .85rem; color: #b42318; text-align: center; }
  .note { margin: 18px 0 0; font-size: .75rem; color: #706f6f; text-align: center; }
</style>
</head>
<body>
<!--
  Ingreso al panel con usuario y contraseña.
  El panel (Sveltia CMS) guarda en GitHub y necesita una llave de GitHub. Esa llave
  vive CIFRADA en admin/acceso.json (AES-256-GCM, clave derivada de la contraseña con
  PBKDF2-SHA256 de 600 000 iteraciones). Solo quien sabe la contraseña la descifra,
  en su propio navegador; la contraseña nunca viaja a ningún servidor.
  Para crear o cambiar el acceso: admin/configurar.html
-->
<main class="card" id="login" hidden>
  <img src="../assets/img/logo-og.png" alt="VM Legal">
  <h1>Panel de contenido</h1>
  <form id="f" autocomplete="on">
    <label for="u">Usuario</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">Contraseña</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="go">Ingresar</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
  <p class="note">¿Olvidó la contraseña? Escríbale a su agencia web.</p>
</main>

<script>
(function () {
  'use strict';
  var KEY = 'sveltia-cms.user';

  function loadPanel() {
    document.getElementById('login').hidden = true;
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js';
    document.body.appendChild(s);
  }

  // ¿La llave sigue sirviendo? Si GitHub la rechaza, se vuelve a pedir la contraseña.
  async function valid(token) {
    try {
      var r = await fetch('https://api.github.com/user', { headers: { Authorization: 'Bearer ' + token } });
      return r.ok;
    } catch (e) { return true; }   // sin red: que el panel muestre su propio aviso
  }

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  async function unlock(cfg, password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(cfg.salt), iterations: cfg.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(cfg.iv) }, key, b64(cfg.ct));
    return new TextDecoder().decode(plain);
  }

  // Sesión ya abierta en este navegador: directo al panel.
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { /* nada */ }
  var form = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  function showLogin(note) {
    localStorage.removeItem(KEY);
    document.getElementById('login').hidden = false;
    msg.textContent = note || '';
  }
  if (saved && saved.token) {
    valid(saved.token).then(function (ok) {
      if (ok) loadPanel(); else showLogin('Su sesión expiró. Ingrese de nuevo.');
    });
  } else {
    showLogin();
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    msg.textContent = '';
    go.disabled = true; go.textContent = 'Verificando…';
    try {
      var cfg = await fetch('acceso.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('sin-acceso');
        return r.json();
      });
      var user = document.getElementById('u').value.trim().toLowerCase();
      if (user !== String(cfg.usuario).toLowerCase()) throw new Error('credenciales');
      var token;
      try { token = await unlock(cfg, document.getElementById('p').value); }
      catch (err) { throw new Error('credenciales'); }
      // Formato que el panel lee al arrancar; él mismo completa los datos del usuario.
      if (!(await valid(token))) throw new Error('llave');
      localStorage.setItem(KEY, JSON.stringify({ backendName: 'github', token: token }));
      loadPanel();
    } catch (err) {
      msg.textContent = err.message === 'sin-acceso' ? 'El acceso todavía no está configurado.'
        : err.message === 'llave' ? 'El acceso venció. Pídale a su agencia web que lo renueve.'
        : 'Usuario o contraseña incorrectos.';
      go.disabled = false; go.textContent = 'Ingresar';
    }
  });
})();
</script>
</body>
</html>
